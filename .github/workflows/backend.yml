name: Backend contract checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  database-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db lint --local --level warning
      - run: supabase test db
