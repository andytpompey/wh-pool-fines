name: Backend contract checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  database-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db lint --local --schema public --level error
      - run: supabase test db
      - name: Bundle and smoke Edge Functions
        shell: bash
        run: |
          smoke_function() {
            local function_name="$1"
            local log_file="/tmp/${function_name}.log"
            local response_file="/tmp/${function_name}-response.json"

            supabase functions serve "$function_name" --no-verify-jwt > "$log_file" 2>&1 &
            local edge_pid=$!
            local response_code="000"

            for attempt in {1..30}; do
              response_code=$(curl --silent --output "$response_file" --write-out '%{http_code}' \
                --request POST "http://127.0.0.1:54321/functions/v1/${function_name}" || true)
              if [[ "$response_code" == "401" ]] && grep --quiet 'Not authorised' "$response_file"; then
                break
              fi
              sleep 1
            done

            kill "$edge_pid" 2>/dev/null || true
            wait "$edge_pid" 2>/dev/null || true

            if [[ "$response_code" != "401" ]] || ! grep --quiet 'Not authorised' "$response_file"; then
              cat "$log_file"
              cat "$response_file" 2>/dev/null || true
              return 1
            fi
          }

          smoke_function commercial-lifecycle
          smoke_function commercial-notifications
