name: RooBin

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_NAME: RooBin
    PRODUCT_BUNDLE_IDENTIFIER: com.roobin.app
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:
  RooBin:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    sources:
      - path: RooBin
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ROOBIN_ENVIRONMENT: staging
        ROOBIN_SUPABASE_PUBLISHABLE_KEY: "$(VITE_SUPABASE_ANON_KEY)"
    scheme:
      testTargets:
        - RooBinTests
        - RooBinUITests
      gatherCoverageData: true

  RooBinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RooBinTests
    dependencies:
      - target: RooBin
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: RooBinTests
        PRODUCT_MODULE_NAME: RooBinTests
        PRODUCT_BUNDLE_IDENTIFIER: com.roobin.app.tests

  RooBinUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RooBinUITests
    dependencies:
      - target: RooBin
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: RooBinUITests
        PRODUCT_MODULE_NAME: RooBinUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.roobin.app.uitests
        TEST_TARGET_NAME: RooBin
